  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .flick { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.6s ease-in-out infinite; }
  @keyframes flick { 0%,100% { transform: scale(1,1) skewX(0deg); } 25% { transform: scale(.96,1.05) skewX(-2deg); }
    50% { transform: scale(1.03,.97) skewX(1.5deg); } 75% { transform: scale(.98,1.03) skewX(-1deg); } }
  .e { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
  .e2 { animation-name: rise2; } .e3 { animation-name: rise3; }
  @keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(30px,-560px); opacity: 0; } }
  @keyframes rise2 { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(-40px,-520px); opacity: 0; } }
  @keyframes rise3 { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: .8; } 100% { transform: translate(10px,-600px); opacity: 0; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }
