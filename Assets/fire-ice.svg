<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="440" viewBox="0 0 1280 440" role="img"><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
  .flick { transform-box: fill-box; transform-origin: 50% 100%; animation: flick 1.6s ease-in-out infinite; }
  @keyframes flick { 0%,100% { transform: scale(1,1) skewX(0deg); } 25% { transform: scale(.96,1.05) skewX(-2deg); }
    50% { transform: scale(1.03,.97) skewX(1.5deg); } 75% { transform: scale(.98,1.03) skewX(-1deg); } }
  .e { animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
  .e2 { animation-name: rise2; } .e3 { animation-name: rise3; }
  @keyframes rise { 0% { transform: translate(0,0); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(30px,-560px); opacity: 0; } }
  @keyframes rise2 { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(-40px,-520px); opacity: 0; } }
  @keyframes rise3 { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: .8; } 100% { transform: translate(10px,-600px); opacity: 0; } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }

  .orb { animation: orb 7s ease-in-out infinite; }
  @keyframes orb { 0%,46% { fill: #FF9230; } 52%,92% { fill: #3A3A3C; } 98%,100% { fill: #FF9230; } }
  .press { transform-box: fill-box; transform-origin: center; animation: press 7s ease-in-out infinite; }
  @keyframes press { 0%,44% { transform: scale(1); } 48% { transform: scale(.93); } 54%,100% { transform: scale(1); } }
  .t1 { animation: t1 7s infinite; } @keyframes t1 { 0%,47% { opacity: 1; } 50%,95% { opacity: 0; } 98%,100% { opacity: 1; } }
  .t2 { animation: t2 7s infinite; } @keyframes t2 { 0%,47% { opacity: 0; } 50%,95% { opacity: 1; } 98%,100% { opacity: 0; } }
  .ripple { transform-box: fill-box; transform-origin: center; animation: rip 7s ease-out infinite; }
  @keyframes rip { 0%,47% { transform: scale(1); opacity: 0; } 48% { opacity: .9; } 66%,100% { transform: scale(1.7); opacity: 0; } }
  .ripple2 { animation-delay: .25s; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.35); opacity: 0; } }
  .pill { transform-box: fill-box; transform-origin: center; animation: press 7s ease-in-out infinite; animation-delay: -1s; }
  .u1 { animation: t1 7s infinite; animation-delay: -1s; } .u2 { animation: t2 7s infinite; animation-delay: -1s; }
  .tok { animation: tok 7s infinite; animation-delay: -1s; } @keyframes tok { 0%,47% { opacity: 1; } 50%,95% { opacity: .2; } 98%,100% { opacity: 1; } }
  .snow { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes fall { 0% { transform: translate(0,0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translate(-20px,420px); opacity: 0; } }
</style><defs><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1">
